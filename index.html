<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunset Drive</title>
  </head>
  <body>
    <main id="app">
      <canvas id="scene" aria-label="Sunset Drive flying car scene"></canvas>
      <section class="hud" aria-label="flight telemetry">
        <div>
          <span>SPD</span>
          <strong id="hud-speed">000</strong>
        </div>
        <div>
          <span>ALT</span>
          <strong id="hud-altitude">000</strong>
        </div>
        <div>
          <span>ENV</span>
          <strong id="hud-environment">SUNSET</strong>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
